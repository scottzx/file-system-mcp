name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --ignore-scripts
      - run: node scripts/setup-python.mjs
      - run: npm run check
      - run: npm test
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${version}`);
          }
          JS
      - run: npm pack --dry-run
      - name: Publish with provenance
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance
